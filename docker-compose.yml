version: '3.8'

services:
  mongo:
    image: mongo:5.0
    container_name: mongo
    platform: linux/amd64
    ports:
      - "27017:27017"
    networks:
      - app_network
    restart: always

  backend:
    build:
      context: ./Backend_nodejs
    container_name: node-backend
    ports:
      - "3001:3001"
    networks:
      - app_network
    environment:
      - NODE_ENV=production
      - JWT_SECRET=your_jwt_secret
      - MONGO_URI=mongodb://mongo:27017/my_database # Connect to the MongoDB service
    depends_on:
      - mongo
    restart: always

  frontend:
    build:
      context: ./frontend-react
    container_name: react-frontend
    ports:
      - "3000:3000"
    networks:
      - app_network
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://node-backend:3001/
    command: npm start
    restart: always

networks:
  app_network:
    driver: bridge

