apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: reactproject
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: mayaelabed/react-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: VITE_API_BASE_URL
          value: "http://backend-service.reactproject:3001/api/v1"
