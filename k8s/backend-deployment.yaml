apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: reactproject
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: mayaelabed/node-backend:latest
        ports:
        - containerPort: 3001
        env:
        - name: MONGO_URI
          value: "mongodb://mongo-service:27017/reactProject"
        - name: JWT_SECRET
          value: "!azerty123456789"
